name: One-time intercity booking URL update
on:
  push:
    paths:
      - '.github/workflows/update-intercity-booking-url.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace intercity booking URL only
        shell: python
        run: |
          from pathlib import Path
          old='https://sarbussat.online/ar/i.php'
          new='https://satglobal.site'
          files=[]
          for p in [Path('index.html'), Path('assets/js/app.js')]:
              if p.exists():
                  s=p.read_text()
                  if old in s:
                      p.write_text(s.replace(old,new))
                      files.append(str(p))
          if not files:
              raise SystemExit('Old intercity booking URL not found')
          for p in [Path('index.html'), Path('assets/js/app.js')]:
              if p.exists() and old in p.read_text():
                  raise SystemExit(f'Old URL remains in {p}')
          print('Updated:', ', '.join(files))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js 2>/dev/null || true
          git commit -m 'Update intercity booking URL to satglobal.site'
          git push origin main