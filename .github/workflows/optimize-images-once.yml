name: Optimize static images once

on:
  push:
    paths:
      - '.github/workflows/optimize-images-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert heavy PNG images to WebP
        run: |
          set -e
          for name in bus-terminal route-desert route-highway route-sunset transport-evolution; do
            cwebp -quiet -q 88 "assets/img/${name}.png" -o "assets/img/${name}.webp"
          done

      - name: Point heavy image references to WebP
        run: |
          set -e
          for name in bus-terminal route-desert route-highway route-sunset transport-evolution; do
            sed -i "s#assets/img/${name}\.png#assets/img/${name}.webp#g" index.html
          done

      - name: Commit optimized assets
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/img/*.webp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: optimize heavy static images"
          git push
