name: One-time production domain update

on:
  push:
    paths:
      - '.github/workflows/update-production-domain.yml'

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace old production domain
        shell: bash
        run: |
          set -euo pipefail
          FILES=(index.html assets/js/app.js robots.txt sitemap.xml)
          for f in "${FILES[@]}"; do
            test -f "$f"
            sed -i 's#https://tameni-zeta\.vercel\.app#https://satpcosa.vercel.app#g' "$f"
          done
          if grep -R "tameni-zeta.vercel.app" index.html assets/js/app.js robots.txt sitemap.xml; then
            echo "Old domain still present"
            exit 1
          fi
          grep -q "https://satpcosa.vercel.app/" index.html
          grep -q "https://satpcosa.vercel.app/sitemap.xml" robots.txt
          grep -q "https://satpcosa.vercel.app/routes" sitemap.xml
          grep -q "https://satpcosa.vercel.app" assets/js/app.js
      - name: Commit domain update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js robots.txt sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Update production domain to satpcosa.vercel.app'
          git push origin main
