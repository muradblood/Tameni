name: One-time Arabic SEO phrase distribution
on:
  push:
    paths:
      - '.github/workflows/seo-keyword-distribution.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update SEO titles and descriptions only
        shell: python
        run: |
          from pathlib import Path

          app=Path('assets/js/app.js')
          s=app.read_text()
          replacements={
            "home: { title: 'النقل الجماعي | حجز رحلات بين المدن والرحلات الدولية', description: 'خدمات النقل الجماعي وحجز رحلات الحافلات بين المدن السعودية والرحلات الدولية، مع معلومات عن الوجهات والمدن وخيارات الحجز.' }": "home: { title: 'سابتكو حجز | حجز النقل الجماعي ورحلات سابتكو', description: 'حجز تذاكر النقل الجماعي عن طريق النت والوصول إلى رحلات سابتكو وحجز تذكرة النقل الجماعي بين المدن والرحلات الدولية.' }",
            "routes: { title: 'رحلات الحافلات بين المدن السعودية | النقل الجماعي', description: 'تعرف على أبرز رحلات الحافلات بين المدن السعودية، المدد التقريبية، الوجهات ومعلومات تساعدك قبل الانتقال إلى الحجز.' }": "routes: { title: 'رحلات سابتكو | مواعيد رحلات النقل الجماعي والأسعار', description: 'تعرف على رحلات النقل الجماعي ومواعيد رحلات النقل الجماعي والأسعار التقريبية للوجهات قبل الانتقال إلى حجز تذكرة سابتكو.' }",
            "'public-transport': { title: 'النقل الجماعي في السعودية | خدمات الحافلات بين المدن', description: 'معلومات عن خدمات النقل الجماعي والحافلات بين المدن السعودية والمحطات وخيارات الحجز الإلكتروني.' }": "'public-transport': { title: 'النقل الجماعي سابتكو | باصات سابتكو وحجز نقل جماعي', description: 'معلومات عن باصات سابتكو ورحلات النقل الجماعي وخيارات حجز نقل جماعي وحجز النقل الجماعي إلكترونيًا بين المدن.' }",
            "'route-riyadh-jeddah': { title: 'رحلة الرياض إلى جدة بالحافلة | النقل الجماعي', description: 'معلومات عن رحلة الحافلة من الرياض إلى جدة، المدة التقريبية ومحطات التوقف وخيار الانتقال إلى الحجز.' }": "'route-riyadh-jeddah': { title: 'حجز سابتكو الرياض جدة | رحلة النقل الجماعي', description: 'معلومات رحلة الرياض إلى جدة مع المدة والتوقفات والسعر التقريبي وخيار حجز تذكرة النقل الجماعي والانتقال إلى الحجز.' }",
            "'route-riyadh-dammam': { title: 'رحلة الرياض إلى الدمام بالحافلة | النقل الجماعي', description: 'معلومات عن رحلة الحافلة من الرياض إلى الدمام، المدة التقريبية ومحطات التوقف وخيار الانتقال إلى الحجز.' }": "'route-riyadh-dammam': { title: 'حجز سابتكو الرياض الدمام | رحلة النقل الجماعي', description: 'معلومات رحلة الرياض إلى الدمام مع المدة والتوقفات والسعر التقريبي وخيار حجز تذكرة سابتكو عبر الإنترنت.' }",
            "'route-jeddah-makkah': { title: 'رحلة جدة إلى مكة بالحافلة | النقل الجماعي', description: 'معلومات عن رحلة الحافلة من جدة إلى مكة المكرمة، المدة التقريبية والتكرار وخيار الانتقال إلى الحجز.' }": "'route-jeddah-makkah': { title: 'حجز سابتكو جدة مكة | مواعيد النقل الجماعي', description: 'معلومات رحلة جدة إلى مكة مع المدة والتكرار والسعر التقريبي وخيار حجز النقل الجماعي والانتقال مباشرة إلى الحجز.' }",
            "cities: { title: 'مدن ومحطات الحافلات في السعودية | النقل الجماعي', description: 'تعرف على محطات وخدمات النقل في الرياض وجدة ومكة والمدينة والدمام وتبوك وحائل وعسير.' }": "cities: { title: 'محطات وباصات سابتكو | رحلات النقل الجماعي في السعودية', description: 'تعرف على محطات وباصات النقل الجماعي في الرياض وجدة ومكة والمدينة والدمام وتبوك وحائل وعسير وخيارات الرحلات.' }"
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'Missing expected SEO entry: {old[:50]}')
              s=s.replace(old,new,1)
          app.write_text(s)

          index=Path('index.html')
          h=index.read_text()
          h=h.replace('<title>النقل الجماعي | حجز رحلات بين المدن والرحلات الدولية</title>','<title>سابتكو حجز | حجز النقل الجماعي ورحلات سابتكو</title>',1)
          h=h.replace('content="خدمات النقل الجماعي وحجز رحلات الحافلات بين المدن السعودية والرحلات الدولية، مع معلومات عن الوجهات والمدن وخيارات الحجز."','content="حجز تذاكر النقل الجماعي عن طريق النت والوصول إلى رحلات سابتكو وحجز تذكرة النقل الجماعي بين المدن والرحلات الدولية."',1)
          h=h.replace('content="النقل الجماعي | حجز رحلات بين المدن والرحلات الدولية"','content="سابتكو حجز | حجز النقل الجماعي ورحلات سابتكو"',2)
          index.write_text(h)
      - name: Commit SEO phrase distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js
          git commit -m 'Distribute Arabic SEO search phrases'
          git push origin main
# trigger-2