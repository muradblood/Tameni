name: One-time fix prerender asset paths
on:
  push:
    paths:
      - '.github/workflows/fix-prerender-assets.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make prerender asset URLs root absolute
        shell: python
        run: |
          from pathlib import Path
          files=list(Path('prerender').glob('*.html'))
          if len(files)!=19:
              raise SystemExit(f'Expected 19 prerender files, found {len(files)}')
          for p in files:
              s=p.read_text()
              s=s.replace('src="assets/','src="/assets/')
              s=s.replace('href="assets/','href="/assets/')
              p.write_text(s)
              check=p.read_text()
              if 'src="assets/' in check or 'href="assets/' in check:
                  raise SystemExit(f'Relative asset path remains in {p}')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prerender/
          git commit -m 'Fix prerender asset paths for nested routes'
          git push origin main