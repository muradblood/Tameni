name: One-time restore intercity booking URL
on:
  push:
    paths:
      - '.github/workflows/restore-intercity-booking-url.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore previous intercity booking URL only
        shell: python
        run: |
          from pathlib import Path
          old='https://satglobal.site'
          new='https://sarbussat.online/ar/i.php'
          changed=[]
          for p in [Path('index.html'), Path('assets/js/app.js')]:
              if p.exists():
                  s=p.read_text()
                  if old in s:
                      p.write_text(s.replace(old,new))
                      changed.append(str(p))
          if not changed:
              raise SystemExit('Current intercity URL not found')
          for p in [Path('index.html'), Path('assets/js/app.js')]:
              if p.exists() and old in p.read_text():
                  raise SystemExit(f'Current URL remains in {p}')
          print('Restored:', ', '.join(changed))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js
          git commit -m 'Restore previous intercity booking URL'
          git push origin main
# trigger 2
