name: One-time Google site name update
on:
  push:
    paths:
      - '.github/workflows/set-google-site-name.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update site name signals only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_json='<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"النقل الجماعي","url":"https://satpcosa.vercel.app/","inLanguage":"ar","description":"خدمات النقل الجماعي وحجز رحلات الحافلات بين المدن السعودية والرحلات الدولية."}</script>'
          new_json='<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"النقل الجماعي سابتكو سات","alternateName":"سابتكو سات","url":"https://satpcosa.vercel.app/","inLanguage":"ar","description":"خدمات النقل الجماعي وحجز رحلات الحافلات بين المدن السعودية والرحلات الدولية."}</script>'
          if old_json not in s:
              raise SystemExit('Expected WebSite JSON-LD not found')
          s=s.replace(old_json,new_json,1)
          marker='<meta property="og:type" content="website">'
          if '<meta property="og:site_name"' not in s:
              if marker not in s:
                  raise SystemExit('OG type marker not found')
              s=s.replace(marker,marker+'\n  <meta property="og:site_name" content="النقل الجماعي سابتكو سات">',1)
          p.write_text(s)
          check=p.read_text()
          for value in ['"name":"النقل الجماعي سابتكو سات"','"alternateName":"سابتكو سات"','og:site_name" content="النقل الجماعي سابتكو سات"']:
              if value not in check:
                  raise SystemExit(f'Missing expected value: {value}')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set Google site name to النقل الجماعي سابتكو سات'
          git push origin main