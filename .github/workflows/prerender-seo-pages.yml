name: One-time SEO prerender pages
on:
  push:
    paths:
      - '.github/workflows/prerender-seo-pages.yml'
permissions:
  contents: write
jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate prerendered HTML and clean internal links
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root=Path('.')
          index_path=root/'index.html'
          app_path=root/'assets/js/app.js'
          vercel_path=root/'vercel.json'
          html=index_path.read_text()

          link_map={
            '#home':'/', '#routes':'/routes', '#public-transport':'/public-transport', '#cities':'/cities', '#blog':'/blog', '#contact':'/contact',
            '#route-riyadh-jeddah':'/routes/riyadh-jeddah', '#route-riyadh-dammam':'/routes/riyadh-dammam', '#route-jeddah-makkah':'/routes/jeddah-makkah',
            '#city-riyadh':'/cities/riyadh', '#city-jeddah':'/cities/jeddah', '#city-makkah':'/cities/makkah', '#city-madinah':'/cities/madinah',
            '#city-dammam':'/cities/dammam', '#city-tabuk':'/cities/tabuk', '#city-hail':'/cities/hail', '#city-asir':'/cities/asir',
            '#blog-1':'/blog/alula-guide', '#blog-2':'/blog/popular-markets', '#blog-3':'/blog/red-sea-beaches'
          }
          for old,new in link_map.items():
              html=html.replace(f'href="{old}"', f'href="{new}"')
          index_path.write_text(html)

          pages={
            '/routes':('routes','page-routes','رحلات سابتكو | مواعيد رحلات النقل الجماعي والأسعار','تعرف على رحلات النقل الجماعي ومواعيد رحلات النقل الجماعي والأسعار التقريبية للوجهات قبل الانتقال إلى حجز تذكرة سابتكو.'),
            '/public-transport':('public-transport','page-public-transport','النقل الجماعي سابتكو | باصات سابتكو وحجز نقل جماعي','معلومات عن باصات سابتكو ورحلات النقل الجماعي وخيارات حجز نقل جماعي وحجز النقل الجماعي إلكترونيًا بين المدن.'),
            '/routes/riyadh-jeddah':('route-riyadh-jeddah','page-route-riyadh-jeddah','حجز سابتكو الرياض جدة | رحلة النقل الجماعي','معلومات رحلة الرياض إلى جدة مع المدة والتوقفات والسعر التقريبي وخيار حجز تذكرة النقل الجماعي والانتقال إلى الحجز.'),
            '/routes/riyadh-dammam':('route-riyadh-dammam','page-route-riyadh-dammam','حجز سابتكو الرياض الدمام | رحلة النقل الجماعي','معلومات رحلة الرياض إلى الدمام مع المدة والتوقفات والسعر التقريبي وخيار حجز تذكرة سابتكو عبر الإنترنت.'),
            '/routes/jeddah-makkah':('route-jeddah-makkah','page-route-jeddah-makkah','حجز سابتكو جدة مكة | مواعيد النقل الجماعي','معلومات رحلة جدة إلى مكة مع المدة والتكرار والسعر التقريبي وخيار حجز النقل الجماعي والانتقال مباشرة إلى الحجز.'),
            '/cities':('cities','page-cities','محطات وباصات سابتكو | رحلات النقل الجماعي في السعودية','تعرف على محطات وباصات النقل الجماعي في الرياض وجدة ومكة والمدينة والدمام وتبوك وحائل وعسير وخيارات الرحلات.'),
            '/cities/riyadh':('city-riyadh','page-city-riyadh','محطة الرياض للحافلات | النقل الجماعي','معلومات عن محطة الرياض وخدمات الرحلات اليومية إلى مدن المملكة.'),
            '/cities/jeddah':('city-jeddah','page-city-jeddah','محطة جدة للحافلات | النقل الجماعي','معلومات عن محطة جدة والرحلات إلى مكة والمدينة والرياض والطائف.'),
            '/cities/makkah':('city-makkah','page-city-makkah','محطة مكة المكرمة للحافلات | النقل الجماعي','معلومات عن محطات مكة المكرمة وخدمات الرحلات للزوار والمعتمرين.'),
            '/cities/madinah':('city-madinah','page-city-madinah','محطة المدينة المنورة للحافلات | النقل الجماعي','معلومات عن محطة المدينة المنورة والرحلات إلى مكة وجدة والرياض.'),
            '/cities/dammam':('city-dammam','page-city-dammam','محطة الدمام للحافلات | النقل الجماعي','معلومات عن محطة الدمام وخدمات النقل إلى الرياض والأحساء والجبيل.'),
            '/cities/tabuk':('city-tabuk','page-city-tabuk','محطة تبوك للحافلات | النقل الجماعي','معلومات عن محطة تبوك والرحلات إلى المدينة وحائل والجوف.'),
            '/cities/hail':('city-hail','page-city-hail','محطة حائل للحافلات | النقل الجماعي','معلومات عن محطة حائل وخدمات النقل إلى الرياض والقصيم والمدينة وتبوك.'),
            '/cities/asir':('city-asir','page-city-asir','محطات عسير وأبها وخميس مشيط | النقل الجماعي','معلومات عن محطات عسير وأبها وخميس مشيط والرحلات إلى الرياض وجدة ونجران.'),
            '/blog':('blog','page-blog','مدونة السفر والنقل في السعودية | النقل الجماعي','مقالات ونصائح عن السفر والنقل والوجهات داخل المملكة العربية السعودية.'),
            '/blog/alula-guide':('blog-1','page-blog-1','دليل السفر إلى العلا | النقل الجماعي','دليل مختصر للتخطيط لزيارة العلا والنقل والسكن وأبرز المعلومات قبل السفر.'),
            '/blog/popular-markets':('blog-2','page-blog-2','أفضل الأسواق الشعبية في السعودية | النقل الجماعي','معلومات مختصرة عن الأسواق الشعبية والتراثية في المدن السعودية.'),
            '/blog/red-sea-beaches':('blog-3','page-blog-3','شواطئ البحر الأحمر في السعودية | النقل الجماعي','تعرف على وجهات ساحل البحر الأحمر مثل جدة وينبع وأملج ونصائح التخطيط للسفر.'),
            '/contact':('contact','page-contact','اتصل بنا | النقل الجماعي','صفحة التواصل والاستفسارات الخاصة بموقع النقل الجماعي.')
          }

          prerender=root/'prerender'
          prerender.mkdir(exist_ok=True)
          rewrites=[]
          base='https://satpcosa.vercel.app'
          template=index_path.read_text()

          for path,(route,page_id,title,desc) in pages.items():
              s=template
              s=re.sub(r'<title>.*?</title>', f'<title>{title}</title>', s, count=1, flags=re.S)
              s=re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{desc}">', s, count=1)
              s=re.sub(r'<link rel="canonical" href="[^"]*">', f'<link rel="canonical" href="{base}{path}">', s, count=1)
              s=re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{title}">', s, count=1)
              s=re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{desc}">', s, count=1)
              s=re.sub(r'<meta property="og:url" content="[^"]*">', f'<meta property="og:url" content="{base}{path}">', s, count=1)
              s=re.sub(r'<meta name="twitter:title" content="[^"]*">', f'<meta name="twitter:title" content="{title}">', s, count=1)
              s=re.sub(r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{desc}">', s, count=1)
              s=s.replace('id="page-home" class="page active main-offset"','id="page-home" class="page main-offset"',1)
              target=f'id="{page_id}" class="page main-offset"'
              if target in s:
                  s=s.replace(target, f'id="{page_id}" class="page active main-offset"',1)
              fname=path.strip('/').replace('/','--')+'.html'
              (prerender/fname).write_text(s)
              rewrites.append({'source':path,'destination':f'/prerender/{fname}'})

          js=app_path.read_text()
          old="link.classList.toggle('active',link.getAttribute('href')===`#${route}`);"
          new="link.classList.toggle('active',link.getAttribute('href')===(routePaths[route]||'/'));"
          if old in js:
              js=js.replace(old,new,1)
          app_path.write_text(js)

          cfg=json.loads(vercel_path.read_text())
          cfg['rewrites']=rewrites
          vercel_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')

          assert len(list(prerender.glob('*.html'))) == 19
          for path,(_,_,title,_) in pages.items():
              fname=path.strip('/').replace('/','--')+'.html'
              text=(prerender/fname).read_text()
              assert f'<title>{title}</title>' in text
              assert f'href="{base}{path}"' in text
          print('Generated 19 prerendered pages')
      - name: Commit prerendered pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js vercel.json prerender/
          git commit -m 'Prerender 19 SEO routes for direct crawling'
          git push origin main
# trigger
