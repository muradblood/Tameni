name: One-time remove loading screen
on:
  push:
    paths:
      - '.github/workflows/remove-loading-screen.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove loading screen only
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          loading_html = '<div id="loading-screen" class="loading-screen" aria-live="polite"><div class="loading-box"><img class="loading-logo" src="assets/img/logo-saptco-transparent.png" alt=""><div class="loading-track"><div class="loading-bar"></div></div><div class="loading-text">جاري التحميل...</div></div></div>\n'
          if loading_html not in html:
              raise SystemExit('Loading HTML not found')
          html = html.replace(loading_html, '', 1)
          index.write_text(html)

          app = Path('assets/js/app.js')
          js = app.read_text()
          loading_js = "  window.addEventListener('load',()=>{const loading=document.getElementById('loading-screen');if(!loading)return;loading.classList.add('is-hidden');setTimeout(()=>loading.remove(),500);});\n"
          if loading_js not in js:
              raise SystemExit('Loading JS not found')
          js = js.replace(loading_js, '', 1)
          app.write_text(js)

          if 'id="loading-screen"' in index.read_text():
              raise SystemExit('Loading screen HTML still exists')
          if "getElementById('loading-screen')" in app.read_text():
              raise SystemExit('Loading screen JS still exists')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js
          git commit -m 'Remove loading screen for immediate page display'
          git push origin main
